version: "3.8"

services:
  # ── Node.js Application ──────────────────────────────────────────────────
  app:
    image: ${DOCKER_USERNAME}/restaurant-project:latest
    container_name: restaurant-app
    restart: unless-stopped
    expose:
      - "3003"          # Only accessible inside the Docker network, not publicly
    networks:
      - webnet

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: restaurant-nginx
    restart: unless-stopped
    ports:
      - "80:80"         # Public HTTP traffic → Nginx → app:3003
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
