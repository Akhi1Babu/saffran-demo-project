name: CI/CD — Build & Deploy to AWS EC2 (Nginx + Docker)

on:
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: Build image and push to Docker Hub ───────────────────────────
  build-and-push:
    name: Build Docker Image & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-project:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 2: SSH into EC2 and deploy with docker-compose ──────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: DOCKER_USERNAME
          script: |
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # ── Set up project directory ──────────────────────────────────
            mkdir -p ~/restaurant-project/nginx

            # ── Write docker-compose.yml (unquoted EOF so vars expand) ────
            cat > ~/restaurant-project/docker-compose.yml << EOF
            version: "3.8"
            services:
              app:
                image: ${DOCKER_USERNAME}/restaurant-project:latest
                container_name: restaurant-app
                restart: unless-stopped
                expose:
                  - "3003"
                networks:
                  - webnet
              nginx:
                image: nginx:alpine
                container_name: restaurant-nginx
                restart: unless-stopped
                ports:
                  - "80:80"
                volumes:
                  - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
                depends_on:
                  - app
                networks:
                  - webnet
            networks:
              webnet:
                driver: bridge
            EOF

            # ── Write nginx.conf ──────────────────────────────────────────
            cat > ~/restaurant-project/nginx/nginx.conf << 'NGINXEOF'
            server {
                listen 80;
                location / {
                    proxy_pass         http://app:3003;
                    proxy_http_version 1.1;
                    proxy_set_header   Upgrade $http_upgrade;
                    proxy_set_header   Connection 'upgrade';
                    proxy_set_header   Host $host;
                    proxy_set_header   X-Real-IP $remote_addr;
                    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header   X-Forwarded-Proto $scheme;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINXEOF

            # ── Pull latest image ─────────────────────────────────────────
            echo "Pulling latest image..."
            docker pull ${DOCKER_USERNAME}/restaurant-project:latest

            # ── Restart stack with docker-compose ─────────────────────────
            cd ~/restaurant-project
            docker compose down || true
            docker compose up -d

            # ── Clean up old images ───────────────────────────────────────
            docker image prune -f

            echo "Deployment complete! App running behind Nginx on port 80."
