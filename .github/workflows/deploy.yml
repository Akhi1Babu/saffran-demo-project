name: CI/CD — Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # ─── JOB 1: Build image and push to Docker Hub ───────────────────────────
  build-and-push:
    name: Build Docker Image & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tagged as both 'latest' and the commit SHA for traceability
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/restaurant-project:latest
            ${{ secrets.DOCKER_USERNAME }}/restaurant-project:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 2: SSH into EC2 and deploy the new image ────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push   # Only runs if build-and-push succeeds

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "=== Pulling latest Docker image ==="
            docker pull ${{ secrets.DOCKER_USERNAME }}/restaurant-project:latest

            echo "=== Stopping old container (if running) ==="
            docker stop restaurant-app || true
            docker rm   restaurant-app || true

            echo "=== Starting new container ==="
            docker run -d \
              --name restaurant-app \
              --restart unless-stopped \
              -p 3003:3003 \
              ${{ secrets.DOCKER_USERNAME }}/restaurant-project:latest

            echo "=== Clean up unused images ==="
            docker image prune -f

            echo "=== Deployment complete! ==="
